name: run-tests

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.1'
            laravel: 9.*
            testbench: 7.*
            stability: prefer-lowest
          - php: '8.1'
            laravel: 9.*
            testbench: 7.*
            stability: prefer-stable
          - php: '8.1'
            laravel: 10.*
            testbench: 8.*
            stability: prefer-lowest
          - php: '8.1'
            laravel: 10.*
            testbench: 8.*
            stability: prefer-stable
          - php: '8.2'
            laravel: 11.*
            testbench: 9.*
            stability: prefer-lowest
          - php: '8.2'
            laravel: 11.*
            testbench: 9.*
            stability: prefer-stable
          - php: '8.2'
            laravel: 12.*
            testbench: 10.*
            stability: prefer-lowest
          - php: '8.2'
            laravel: 12.*
            testbench: 10.*
            stability: prefer-stable
          - php: '8.3'
            laravel: 13.*
            testbench: 11.*
            stability: prefer-lowest
          - php: '8.3'
            laravel: 13.*
            testbench: 11.*
            stability: prefer-stable

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} | ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
